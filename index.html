<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur — Jeu de dés 25 000</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --good: #3ecf8e;
    --bad: #ff5c5c;
    --gold: #ffcd3c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    position: relative;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.92rem;
  }
  .settings {
    display:flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.88rem;
  }
  .settings label {
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--muted);
  }
  .settings input[type="number"] {
    width: 90px;
  }
  input[type="text"], input[type="number"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: #4f8cff;
  }

  /* Bandeau total */
  .totals-bar {
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .total-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    display:flex;
    flex-direction: column;
    align-items: center;
    min-width: 140px;
  }
  .total-chip .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .total-chip .value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .teams {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin-bottom: 18px;
  }
  .team {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.4s ease, transform 0.3s ease, background-color 0.8s ease;
  }
  .team::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--team-color);
  }
  .team-header {
    display:flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .team-name {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .team-name:hover, .team-name:focus {
    border-bottom: 1px dashed var(--border);
    outline: none;
  }
  .remove-team {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.5;
    padding: 2px 6px;
  }
  .remove-team:hover { opacity: 1; color: var(--bad); }
  .score {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 10px 0 4px;
    font-variant-numeric: tabular-nums;
    transition: color 0.25s ease, transform 0.2s ease;
    color: var(--team-color);
  }
  .score.won { color: var(--good) !important; }
  .score.pulse { animation: scorePulse 1.1s ease; }
  @keyframes scorePulse {
    0% { transform: scale(1); }
    25% { transform: scale(1.18); text-shadow: 0 0 18px var(--gold); }
    50% { transform: scale(0.97); }
    75% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .status {
    min-height: 20px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .status.won { color: var(--good); font-weight: 600; }
  .status.bust { color: var(--bad); }
  .status.milestone { color: var(--gold); font-weight: 600; }

  .mini-stats {
    display:flex;
    gap: 14px;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .mini-stats b { color: var(--text); }

  .input-row {
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-row input[type="number"] {
    flex: 1;
    min-width: 0;
    font-size: 1rem;
    padding: 10px 12px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .input-row .btn { white-space: nowrap; flex-shrink: 0; }
  .btn-sub {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .team .btn-sub:hover { border-color: var(--team-color); color: var(--team-color); }
  .quick-row {
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .quick-row button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
  }
  .quick-row button:hover { color: var(--text); border-color: var(--text); }
  .history {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    max-height: 150px;
    overflow-y: auto;
  }
  .history h4 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .history ul {
    list-style: none;
    margin: 0; padding: 0;
    display:flex;
    flex-direction: column;
    gap: 4px;
  }
  .history li {
    display:flex;
    justify-content: space-between;
    font-size: 0.83rem;
    color: var(--muted);
    padding: 4px 6px;
    border-radius: 6px;
    background: var(--panel-2);
  }
  .history li .neg { color: var(--bad); }
  .history li button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0 4px;
  }
  .history li button:hover { color: var(--bad); }
  .history-empty {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    padding: 6px;
  }

  .add-team-card {
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    display:flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 600;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .add-team-card:hover {
    border-color: #4f8cff;
    color: #4f8cff;
  }

  .footer-actions {
    display:flex;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
  }
  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-reset:hover { color: var(--bad); border-color: var(--bad); }
  .winner-banner {
    text-align: center;
    margin: 0 0 18px;
    padding: 12px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(62,207,142,0.15), rgba(62,207,142,0.05));
    border: 1px solid rgba(62,207,142,0.4);
    color: var(--good);
    font-weight: 700;
    font-size: 1.05rem;
    display: none;
  }
  .winner-banner.show { display: block; }

  /* Toast milestone 20000 */
  .milestone-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: linear-gradient(135deg, #ffcd3c, #ff9d3c);
    color: #241a00;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(255, 205, 60, 0.4);
    opacity: 0;
    z-index: 999;
    pointer-events: none;
    font-size: 0.95rem;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .milestone-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .team.milestone-glow {
    box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(255, 205, 60, 0.5);
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 9px;
    height: 14px;
    z-index: 2002;
    pointer-events: none;
    border-radius: 2px;
    animation-name: confetti-fall;
    animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 1);
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* Victoire — score à 0 */
  .victory-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: linear-gradient(135deg, #ffcd3c, #ff7a59, #b26bff);
    background-size: 200% 200%;
    color: #1a1200;
    font-weight: 800;
    font-size: 1.6rem;
    padding: 22px 40px;
    border-radius: 20px;
    box-shadow: 0 16px 60px rgba(255, 205, 60, 0.55);
    opacity: 0;
    z-index: 1001;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .victory-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: victoryGradient 1.8s ease infinite;
  }
  @keyframes victoryGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .team.victory-glow {
    animation: victoryPulse 0.9s ease-in-out 3;
    box-shadow: 0 0 0 3px var(--gold), 0 0 45px rgba(255, 205, 60, 0.75);
  }
  @keyframes victoryPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  body.screen-flash::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,205,60,0.35), transparent 70%);
    z-index: 1000;
    pointer-events: none;
    animation: flashFade 0.7s ease forwards;
  }
  @keyframes flashFade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Statistiques */
  .stats-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-top: 22px;
  }
  .stats-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 16px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .stats-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-card .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .stats-table-wrap {
    overflow-x: auto;
  }
  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  table.stats-table th, table.stats-table td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.stats-table th {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  table.stats-table td.team-cell {
    font-weight: 700;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  table.stats-table td.team-cell .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  table.stats-table tbody tr:hover {
    background: var(--panel-2);
  }
  .progress-track {
    display:inline-block;
    width: 90px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    vertical-align: middle;
    margin-right: 6px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
  }
  .stats-empty {
    color: var(--muted);
    font-size: 0.88rem;
    font-style: italic;
    text-align: center;
    padding: 10px 0;
  }

  /* ===== Boutons désactivés (partie terminée) ===== */
  .btn:disabled, .quick-row button:disabled, .input-row input:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .settings .game-name-label { flex: 1 1 100%; justify-content: center; }
  .settings input.game-name { width: min(420px, 70vw); }

  /* ===== Bouton YUM ===== */
  .btn-yum {
    width: 100%;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff5c9c, #ffcd3c, #3ecf8e, #4f8cff, #b26bff, #ff5c9c);
    background-size: 300% 100%;
    color: #1a1200;
    font-weight: 900;
    letter-spacing: 0.12em;
    font-size: 1rem;
    animation: yumShimmer 3s linear infinite;
    box-shadow: 0 4px 18px rgba(255, 92, 156, 0.25);
  }
  .btn-yum:hover { filter: brightness(1.12); }
  .btn-yum:disabled { animation: none; filter: grayscale(0.8); box-shadow: none; }
  @keyframes yumShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .winner-banner .btn-next {
    margin-left: 12px;
    background: var(--good);
    color: #05281a;
    padding: 6px 14px;
    font-size: 0.85rem;
  }
  .winner-banner.yum {
    background: linear-gradient(90deg, rgba(255,92,156,0.25), rgba(255,205,60,0.25), rgba(79,140,255,0.25));
    border-color: rgba(255, 205, 60, 0.7);
    color: var(--gold);
  }

  /* ===== Célébration YUM ===== */
  .yum-overlay {
    position: fixed; inset: 0; z-index: 2000;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; cursor: pointer;
    background: radial-gradient(circle at center, rgba(10,10,20,0.35), rgba(10,10,20,0.78));
  }
  .yum-overlay.show { display: flex; animation: yumFadeIn 0.3s ease both; }
  .yum-overlay.hide { animation: yumFadeOut 0.7s ease both; }
  @keyframes yumFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes yumFadeOut { from { opacity: 1; } to { opacity: 0; } }
  .yum-title {
    font-size: clamp(4.5rem, 24vw, 14rem);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(90deg, #ff5c9c, #ffcd3c, #3ecf8e, #4f8cff, #b26bff, #ff5c9c);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 28px rgba(255, 205, 60, 0.85));
    animation: yumTitleIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               yumShimmer 1.4s linear infinite,
               yumBounce 0.7s ease-in-out 0.9s infinite alternate;
  }
  @keyframes yumTitleIn {
    0% { transform: scale(0) rotate(-25deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes yumBounce {
    0% { transform: scale(1) rotate(-2deg); }
    100% { transform: scale(1.12) rotate(2deg); }
  }
  .yum-dice { font-size: clamp(2rem, 9vw, 4.5rem); margin-bottom: 6px; animation: yumSpin 1.6s linear infinite; }
  @keyframes yumSpin { to { transform: rotate(360deg); } }
  .yum-sub {
    margin-top: 10px;
    font-size: clamp(1.3rem, 5vw, 2.6rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 205, 60, 0.9), 0 3px 0 rgba(0,0,0,0.4);
    padding: 0 16px;
    animation: yumSubIn 0.7s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .yum-sub2 {
    margin-top: 8px;
    font-size: clamp(1rem, 3vw, 1.5rem);
    color: var(--gold);
    font-weight: 700;
    animation: yumSubIn 0.7s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .yum-hint { margin-top: 26px; font-size: 0.78rem; color: rgba(255,255,255,0.55); }
  @keyframes yumSubIn {
    from { transform: translateY(40px) scale(0.6); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  body.yum-rainbow::before {
    content: "";
    position: fixed; inset: 0; z-index: 1999;
    pointer-events: none;
    background: conic-gradient(from 0deg at 50% 50%, #ff5c9c, #ffcd3c, #3ecf8e, #4f8cff, #b26bff, #ff5c9c);
    mix-blend-mode: screen;
    animation: yumRainbow 3.6s linear forwards;
  }
  @keyframes yumRainbow {
    0% { opacity: 0; filter: hue-rotate(0deg); }
    8% { opacity: 0.6; }
    40% { opacity: 0.25; }
    100% { opacity: 0; filter: hue-rotate(720deg); }
  }
  .wrap.shake { animation: yumShake 0.5s ease-in-out 4; }
  @keyframes yumShake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-7px, 4px) rotate(-0.6deg); }
    40% { transform: translate(6px, -5px) rotate(0.5deg); }
    60% { transform: translate(-5px, -3px) rotate(-0.4deg); }
    80% { transform: translate(5px, 5px) rotate(0.4deg); }
  }
  .team.yum-glow { animation: yumCard 0.5s ease-in-out infinite alternate; }
  @keyframes yumCard {
    0% { transform: scale(1); box-shadow: 0 0 0 3px #ff5c9c, 0 0 50px rgba(255,92,156,0.9); }
    33% { box-shadow: 0 0 0 3px #ffcd3c, 0 0 50px rgba(255,205,60,0.9); }
    66% { box-shadow: 0 0 0 3px #3ecf8e, 0 0 50px rgba(62,207,142,0.9); }
    100% { transform: scale(1.04); box-shadow: 0 0 0 3px #4f8cff, 0 0 60px rgba(79,140,255,0.9); }
  }
  .fx-piece { position: fixed; pointer-events: none; z-index: 2001; will-change: transform, opacity; }
  .emoji-piece {
    position: fixed; top: -70px; z-index: 2001; pointer-events: none;
    animation: emojiFall linear forwards;
  }
  @keyframes emojiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--sway), 118vh) rotate(var(--rot)); opacity: 1; }
  }

  /* ===== Historique des parties ===== */
  .games-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-top: 34px;
  }
  .games-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .games-head .stats-title { margin: 0; }
  .btn-clear {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; font-size: 0.78rem;
  }
  .btn-clear:hover { color: var(--bad); border-color: var(--bad); }
  .btn-clear.armed { color: #fff; background: var(--bad); border-color: var(--bad); }
  .games-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .game-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .game-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--border); }
  .game-card.won::before { background: var(--good); }
  .game-card.yum::before { background: linear-gradient(180deg, #ff5c9c, #ffcd3c, #3ecf8e, #4f8cff, #b26bff); }
  .game-card.abandoned::before { background: var(--muted); }
  .game-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .game-title {
    flex: 1; min-width: 0;
    background: transparent; border: none; border-bottom: 1px dashed transparent;
    color: var(--text); font-size: 0.98rem; font-weight: 700; padding: 3px 2px; border-radius: 0;
  }
  .game-title:hover, .game-title:focus { border-bottom-color: var(--border); outline: none; }
  .game-del { background: none; border: none; color: var(--muted); cursor: pointer; opacity: 0.5; font-size: 0.95rem; padding: 2px 6px; }
  .game-del:hover { opacity: 1; color: var(--bad); }
  .game-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
  .badge.won { background: rgba(62,207,142,0.15); color: var(--good); }
  .badge.yum { background: linear-gradient(90deg, #ff5c9c, #ffcd3c, #3ecf8e, #4f8cff); color: #1a1200; }
  .badge.abandoned { background: rgba(154,161,172,0.15); color: var(--muted); }
  .game-players { display: flex; flex-direction: column; gap: 4px; }
  .game-player {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 6px 8px; border-radius: 8px; background: var(--panel);
    font-size: 0.86rem;
  }
  .game-player.winner { outline: 1px solid rgba(255,205,60,0.55); background: rgba(255,205,60,0.07); }
  .game-player .pname { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .game-player .pname span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-player .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .game-player .pscore { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .game-player .psub { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>🎲 Calculateur — Jeu de dés 25 000</h1>
    <p>Chaque équipe part du score de départ et on soustrait les points marqués à chaque tour, jusqu'à zéro.</p>
  </header>

  <div class="settings">
    <label class="game-name-label">Nom de la partie
      <input type="text" id="gameName" class="game-name" placeholder="Nom de la partie" oninput="onGameNameInput(this.value)">
    </label>
    <label>Score de départ
      <input type="number" id="startScore" value="25000" step="500" min="0">
    </label>
    <label>
      <input type="checkbox" id="exactMode" checked>
      Il faut tomber pile sur 0 (sinon le tour est refusé)
    </label>
    <label>
      <input type="checkbox" id="soundOn" checked>
      🔊 Sons (fanfare YUM)
    </label>
  </div>

  <div class="totals-bar" id="totalsBar"></div>

  <div class="winner-banner" id="winnerBanner"></div>

  <div class="teams" id="teamsContainer"></div>

  <div class="stats-section" id="statsSection"></div>

  <div class="footer-actions">
    <button class="btn btn-reset" onclick="resetGame()">↺ Nouvelle partie</button>
  </div>

  <div class="games-section" id="gamesSection"></div>
</div>

<div class="milestone-toast" id="milestoneToast"></div>
<div class="victory-banner" id="victoryBanner"></div>

<div class="yum-overlay" id="yumOverlay" onclick="hideYum()">
  <div class="yum-dice">🎲🎲🎲🎲🎲</div>
  <div class="yum-title">YUM !</div>
  <div class="yum-sub" id="yumTeam"></div>
  <div class="yum-sub2">🏆 La partie est gagnée ! 🏆</div>
  <div class="yum-hint">(cliquer pour fermer)</div>
</div>

<script>
  const PALETTE = ['#4f8cff', '#ff7a59', '#ffcd3c', '#b26bff', '#3ecf8e', '#ff5c9c'];
  const MAX_TEAMS = 6;
  const MIN_TEAMS = 2;
  const MILESTONE = 20000;
  const GREEN_THRESHOLD = 20000;
  const RED_THRESHOLD = 5000;

  // Couleur de fond de la carte selon le score : neutre au-dessus de 20000,
  // vert entre 5000 et 20000, rouge sous 5000 — plus foncé en s'approchant de 0.
  function zoneBackground(score) {
    if (score > GREEN_THRESHOLD) return null;
    if (score > RED_THRESHOLD) {
      const range = GREEN_THRESHOLD - RED_THRESHOLD;
      const t = (score - RED_THRESHOLD) / range; // 0 près de 5000 (foncé) -> 1 près de 20000 (clair)
      const lightness = 11 + t * 11; // 11% -> 22%
      return `hsl(142, 55%, ${lightness}%)`;
    }
    const t = Math.max(0, score) / RED_THRESHOLD; // 0 à zéro (le plus foncé) -> 1 à 5000 (plus clair)
    const lightness = 8 + t * 12; // 8% -> 20%
    return `hsl(2, 65%, ${lightness}%)`;
  }

  const GAMES_KEY = 'de25000.games';

  function loadGames() {
    try {
      const raw = localStorage.getItem(GAMES_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveGames() {
    try { localStorage.setItem(GAMES_KEY, JSON.stringify(games)); } catch (e) { /* stockage indisponible : on reste en mémoire */ }
  }

  // Nom par défaut : jour, date, année et heure du moment
  function defaultGameName(d) {
    d = d || new Date();
    const s = d.toLocaleString('fr-CA', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString('fr-CA', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  function newGameState() {
    return { finished: false, winnerId: null, viaYum: false, archivedId: null, startedAt: Date.now() };
  }

  let games = loadGames();
  let game = newGameState();
  let clearArmed = false;

  let nextId = 3;
  let state = {
    teams: [
      { id: 1, name: 'Équipe 1', score: 25000, history: [], hitMilestone: false },
      { id: 2, name: 'Équipe 2', score: 25000, history: [], hitMilestone: false }
    ]
  };

  function getStart() {
    const v = parseInt(document.getElementById('startScore').value, 10);
    return isNaN(v) ? 25000 : v;
  }

  function isExactMode() {
    return document.getElementById('exactMode').checked;
  }

  function colorFor(index) {
    return PALETTE[index % PALETTE.length];
  }

  function addTeam() {
    if (state.teams.length >= MAX_TEAMS) return;
    state.teams.push({
      id: nextId++,
      name: 'Équipe ' + (state.teams.length + 1),
      score: getStart(),
      history: [],
      hitMilestone: false
    });
    render();
  }

  function removeTeam(id) {
    if (state.teams.length <= MIN_TEAMS) return;
    state.teams = state.teams.filter(t => t.id !== id);
    render();
  }

  function quickAdd(id, amount) {
    const input = document.getElementById('input-' + id);
    const current = parseInt(input.value, 10) || 0;
    input.value = current + amount;
    input.focus();
  }

  function clearInput(id) {
    const input = document.getElementById('input-' + id);
    input.value = '';
    input.focus();
  }

  function findTeam(id) {
    return state.teams.find(t => t.id === id);
  }

  function subtractScore(id) {
    const input = document.getElementById('input-' + id);
    const pts = parseInt(input.value, 10);
    const statusEl = document.getElementById('status-' + id);
    const t = findTeam(id);
    if (!t) return;

    if (game.finished) {
      statusEl.textContent = "La partie est terminée — lancez une nouvelle partie.";
      statusEl.className = 'status bust';
      return;
    }

    if (isNaN(pts) || pts <= 0) {
      statusEl.textContent = "Entrez un nombre de points valide.";
      statusEl.className = 'status bust';
      return;
    }

    const newScore = t.score - pts;

    if (newScore < 0) {
      statusEl.textContent = `Trop de points — le score irait à ${newScore.toLocaleString('fr-CA')} (refusé).`;
      statusEl.className = 'status bust';
      return;
    }

    if (isExactMode() && newScore !== 0 && pts > t.score) {
      statusEl.textContent = "Score refusé (mode exact requis).";
      statusEl.className = 'status bust';
      return;
    }

    const crossedMilestone = t.score > MILESTONE && newScore <= MILESTONE && !t.hitMilestone;
    const reachedZero = newScore === 0 && t.score !== 0;

    t.score = newScore;
    t.history.push({ pts, resultingScore: newScore });
    input.value = '';
    statusEl.textContent = '';
    statusEl.className = 'status';

    if (reachedZero) finishGame(t, false);
    render();

    if (reachedZero) {
      t.hitMilestone = true;
      celebrateWin(t);
    } else if (crossedMilestone) {
      t.hitMilestone = true;
      celebrateMilestone(t);
    }
  }

  function undoLast(id) {
    const t = findTeam(id);
    if (!t || t.history.length === 0) return;
    if (game.finished && game.winnerId !== t.id) return;
    const entry = t.history.pop();
    t.score = entry.yum ? entry.before : t.score + entry.pts;
    if (t.score > MILESTONE) t.hitMilestone = false;
    if (game.finished && game.winnerId === t.id && t.score !== 0) {
      reopenGame();
      hideYum();
    }
    render();
  }

  // ---------- Fin de partie, archivage, YUM ----------
  function realHistory(t) { return t.history.filter(h => !h.yum); }

  function snapshotTeams() {
    return state.teams.map((t, i) => {
      const rh = realHistory(t);
      return {
        name: (t.name || '').trim() || ('Équipe ' + (i + 1)),
        color: colorFor(i),
        score: t.score,
        rounds: rh.length,
        total: rh.reduce((s, h) => s + h.pts, 0)
      };
    });
  }

  function archiveGame(status, winnerTeam) {
    const nameInput = document.getElementById('gameName');
    const idx = winnerTeam ? state.teams.indexOf(winnerTeam) : -1;
    const entry = {
      id: 'g' + Date.now() + Math.floor(Math.random() * 1000),
      name: nameInput.value.trim() || defaultGameName(),
      startedAt: game.startedAt,
      endedAt: Date.now(),
      startScore: getStart(),
      status: status,                       // 'won' | 'yum' | 'abandoned'
      winnerIndex: idx,
      teams: snapshotTeams()
    };
    games.unshift(entry);
    saveGames();
    renderGames();
    return entry.id;
  }

  function finishGame(team, viaYum) {
    game.finished = true;
    game.winnerId = team.id;
    game.viaYum = viaYum;
    game.archivedId = archiveGame(viaYum ? 'yum' : 'won', team);
  }

  function reopenGame() {
    if (game.archivedId) {
      games = games.filter(g => g.id !== game.archivedId);
      saveGames();
      renderGames();
    }
    game.finished = false;
    game.winnerId = null;
    game.viaYum = false;
    game.archivedId = null;
  }

  function declareYum(id) {
    if (game.finished) return;
    const t = findTeam(id);
    if (!t) return;
    t.history.push({ pts: 0, resultingScore: 0, yum: true, before: t.score });
    t.score = 0;
    t.hitMilestone = true;
    finishGame(t, true);
    render();
    celebrateYum(t);
  }

  function onGameNameInput(value) {
    if (!game.archivedId) return;
    const g = games.find(x => x.id === game.archivedId);
    if (g) {
      g.name = value.trim() || defaultGameName();
      saveGames();
      renderGames();
    }
  }

  function celebrateMilestone(team) {
    const toast = document.getElementById('milestoneToast');
    toast.textContent = `⚡ ${team.name} passe sous les 20 000 !`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);

    const card = document.getElementById('team-' + team.id);
    if (card) {
      card.classList.add('milestone-glow');
      setTimeout(() => card.classList.remove('milestone-glow'), 2200);
    }
    const scoreEl = document.getElementById('score-' + team.id);
    if (scoreEl) {
      scoreEl.classList.remove('pulse');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pulse');
    }

    launchConfetti(60);
  }

  function celebrateWin(team) {
    const banner = document.getElementById('victoryBanner');
    banner.textContent = `🏆 ${team.name} termine la partie ! 🏆`;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 3600);

    const card = document.getElementById('team-' + team.id);
    if (card) {
      card.classList.add('victory-glow');
      setTimeout(() => card.classList.remove('victory-glow'), 3200);
    }
    const scoreEl = document.getElementById('score-' + team.id);
    if (scoreEl) {
      scoreEl.classList.remove('pulse');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pulse');
    }

    // Grosse pluie de confettis en plusieurs vagues, façon feu d'artifice
    launchConfetti(140);
    setTimeout(() => launchConfetti(90), 350);
    setTimeout(() => launchConfetti(90), 750);

    document.body.classList.add('screen-flash');
    setTimeout(() => document.body.classList.remove('screen-flash'), 700);
  }

  function launchConfetti(count) {
    const colors = ['#ffcd3c', '#ff7a59', '#4f8cff', '#3ecf8e', '#ff5c9c', '#b26bff'];
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      const size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = (size * 1.5) + 'px';
      if (Math.random() > 0.5) piece.style.borderRadius = '50%';
      const duration = 1.8 + Math.random() * 1.6;
      const delay = Math.random() * 0.4;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.opacity = '0';
      document.body.appendChild(piece);
      setTimeout(() => { piece.style.opacity = '1'; }, delay * 1000);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
  }

  function render() {
    renderTeams();
    renderTotals();
    renderStats();
    checkWinner();
  }

  function renderStats() {
    const section = document.getElementById('statsSection');
    const start = getStart();
    const anyRounds = state.teams.some(t => t.history.length > 0);

    // Stats par équipe
    const teamStats = state.teams.map((t, index) => {
      const pts = realHistory(t).map(h => h.pts);
      const rounds = pts.length;
      const total = pts.reduce((s, p) => s + p, 0);
      const average = rounds > 0 ? total / rounds : 0;
      const best = rounds > 0 ? Math.max(...pts) : 0;
      const worst = rounds > 0 ? Math.min(...pts) : 0;
      const progress = start > 0 ? Math.min(100, Math.max(0, ((start - t.score) / start) * 100)) : 0;
      return { team: t, color: colorFor(index), rounds, total, average, best, worst, progress };
    });

    // Stats globales
    const totalRoundsAll = teamStats.reduce((s, x) => s + x.rounds, 0);
    const totalPointsAll = teamStats.reduce((s, x) => s + x.total, 0);
    const globalAverage = totalRoundsAll > 0 ? totalPointsAll / totalRoundsAll : 0;

    let bestRoundOverall = null;
    teamStats.forEach(x => {
      realHistory(x.team).forEach(h => {
        if (!bestRoundOverall || h.pts > bestRoundOverall.pts) {
          bestRoundOverall = { pts: h.pts, teamName: x.team.name, color: x.color };
        }
      });
    });

    let leader = null;
    if (anyRounds || state.teams.length > 0) {
      leader = state.teams.reduce((min, t) => (min === null || t.score < min.score) ? t : min, null);
    }
    const leaderIndex = leader ? state.teams.indexOf(leader) : -1;

    const summaryHtml = `
      <div class="stat-card">
        <div class="label">Équipe en tête</div>
        <div class="value" style="color:${leader ? colorFor(leaderIndex) : 'inherit'};">${leader ? escapeAttr(leader.name) : '—'}</div>
        <div class="sub">${leader ? leader.score.toLocaleString('fr-CA') + ' pts restants' : ''}</div>
      </div>
      <div class="stat-card">
        <div class="label">Tours joués (total)</div>
        <div class="value">${totalRoundsAll}</div>
      </div>
      <div class="stat-card">
        <div class="label">Points joués (total)</div>
        <div class="value">${totalPointsAll.toLocaleString('fr-CA')}</div>
      </div>
      <div class="stat-card">
        <div class="label">Moyenne globale / tour</div>
        <div class="value">${globalAverage.toLocaleString('fr-CA', {maximumFractionDigits: 0})}</div>
      </div>
      <div class="stat-card">
        <div class="label">Meilleur tour (record)</div>
        <div class="value" style="color:${bestRoundOverall ? bestRoundOverall.color : 'inherit'};">${bestRoundOverall ? bestRoundOverall.pts.toLocaleString('fr-CA') : '—'}</div>
        <div class="sub">${bestRoundOverall ? escapeAttr(bestRoundOverall.teamName) : ''}</div>
      </div>
    `;

    let tableHtml;
    if (!anyRounds) {
      tableHtml = '<div class="stats-empty">Jouez un premier tour pour voir apparaître les statistiques détaillées.</div>';
    } else {
      const rows = teamStats.map(x => {
        const barColor = x.progress >= 80 ? 'var(--good)' : (x.progress >= 40 ? x.color : 'var(--bad)');
        return `
          <tr>
            <td class="team-cell"><span class="dot" style="background:${x.color};"></span>${escapeAttr(x.team.name)}</td>
            <td>${x.team.score.toLocaleString('fr-CA')}</td>
            <td>${x.rounds}</td>
            <td>${x.total.toLocaleString('fr-CA')}</td>
            <td>${x.average.toLocaleString('fr-CA', {maximumFractionDigits: 0})}</td>
            <td>${x.rounds > 0 ? x.best.toLocaleString('fr-CA') : '—'}</td>
            <td>${x.rounds > 0 ? x.worst.toLocaleString('fr-CA') : '—'}</td>
            <td>
              <span class="progress-track"><span class="progress-fill" style="width:${x.progress}%; background:${barColor};"></span></span>
              ${x.progress.toFixed(0)}%
            </td>
          </tr>
        `;
      }).join('');

      tableHtml = `
        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>Équipe</th>
                <th>Score actuel</th>
                <th>Tours</th>
                <th>Total joué</th>
                <th>Moyenne / tour</th>
                <th>Meilleur tour</th>
                <th>Pire tour</th>
                <th>Progression</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    section.innerHTML = `
      <h3 class="stats-title">📊 Statistiques</h3>
      <div class="stats-summary">${summaryHtml}</div>
      ${tableHtml}
    `;
  }

  function renderTeams() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';

    state.teams.forEach((t, index) => {
      const color = colorFor(index);
      const card = document.createElement('div');
      card.className = 'team';
      card.id = 'team-' + t.id;
      card.style.setProperty('--team-color', color);
      const bg = zoneBackground(t.score);
      card.style.backgroundColor = bg || 'var(--panel)';

      const removeBtn = state.teams.length > MIN_TEAMS
        ? `<button class="remove-team" title="Retirer cette équipe" onclick="removeTeam(${t.id})">✕</button>`
        : '';

      const locked = game.finished;
      const dis = locked ? 'disabled' : '';
      const roundsPlayed = realHistory(t).length;
      const totalPlayed = t.history.reduce((sum, h) => sum + h.pts, 0);

      let historyHtml;
      if (t.history.length === 0) {
        historyHtml = '<div class="history-empty">Aucun tour joué</div>';
      } else {
        const items = t.history.slice().reverse().map((h, idxRev) => {
          const idx = t.history.length - 1 - idxRev;
          const isLast = idx === t.history.length - 1;
          const canUndo = isLast && (!locked || game.winnerId === t.id);
          const undoHtml = canUndo ? `<button onclick="undoLast(${t.id})">↺ annuler</button>` : '';
          if (h.yum) {
            return `<li><span>🎉 <b>YUM !</b> → 0</span>${undoHtml}</li>`;
          }
          return `<li><span>Tour ${idx + 1} : <span class="neg">-${h.pts.toLocaleString('fr-CA')}</span> → ${h.resultingScore.toLocaleString('fr-CA')}</span>${undoHtml}</li>`;
        }).join('');
        historyHtml = `<ul>${items}</ul>`;
      }

      card.innerHTML = `
        <div class="team-header">
          <input class="team-name" id="name-${t.id}" type="text" value="${escapeAttr(t.name)}" oninput="renameTeam(${t.id}, this.value)">
          ${removeBtn}
        </div>
        <div class="score" id="score-${t.id}">${t.score.toLocaleString('fr-CA')}</div>
        <div class="status" id="status-${t.id}"></div>
        <div class="mini-stats">
          <span>Tours : <b>${roundsPlayed}</b></span>
          <span>Total joué : <b>${totalPlayed.toLocaleString('fr-CA')}</b></span>
        </div>
        <div class="input-row">
          <input type="number" id="input-${t.id}" placeholder="Points du tour" inputmode="numeric" ${dis}>
          <button class="btn btn-sub" onclick="subtractScore(${t.id})" ${dis}>Soustraire</button>
        </div>
        <button class="btn btn-yum" onclick="declareYum(${t.id})" ${dis} title="Cette équipe a fait un YUM : elle gagne la partie !">🎲 YUM !</button>
        <div class="quick-row">
          <button onclick="quickAdd(${t.id},50)" ${dis}>+50</button>
          <button onclick="quickAdd(${t.id},100)" ${dis}>+100</button>
          <button onclick="quickAdd(${t.id},250)" ${dis}>+250</button>
          <button onclick="quickAdd(${t.id},500)" ${dis}>+500</button>
          <button onclick="quickAdd(${t.id},1000)" ${dis}>+1000</button>
          <button onclick="clearInput(${t.id})" style="margin-left:auto;" ${dis}>effacer</button>
        </div>
        <div class="history">
          <h4>Historique</h4>
          ${historyHtml}
        </div>
      `;

      if (t.score === 0) {
        const scoreEl = card.querySelector('.score');
        scoreEl.classList.add('won');
        card.querySelector('.status').textContent = (game.viaYum && game.winnerId === t.id) ? '🎉 YUM ! Partie gagnée !' : '🏆 Score atteint !';
        card.querySelector('.status').className = 'status won';
      }

      container.appendChild(card);

      const input = document.getElementById('input-' + t.id);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') subtractScore(t.id);
      });
    });

    if (state.teams.length < MAX_TEAMS) {
      const addCard = document.createElement('div');
      addCard.className = 'add-team-card';
      addCard.textContent = '+ Ajouter une équipe';
      addCard.onclick = addTeam;
      container.appendChild(addCard);
    }
  }

  function renameTeam(id, value) {
    const t = findTeam(id);
    if (t) {
      t.name = value;
      renderTotals();
    }
  }

  function renderTotals() {
    const bar = document.getElementById('totalsBar');

    bar.innerHTML = state.teams.map((t, index) => {
      const color = colorFor(index);
      const totalPlayed = t.history.reduce((sum, h) => sum + h.pts, 0);
      return `
        <div class="total-chip" style="border-color:${color}66;">
          <div class="label" style="color:${color};">${escapeAttr(t.name)}</div>
          <div class="value">${totalPlayed.toLocaleString('fr-CA')} pts joués</div>
        </div>
      `;
    }).join('');
  }

  function checkWinner() {
    const banner = document.getElementById('winnerBanner');
    const w = game.finished ? findTeam(game.winnerId) : null;
    if (!w) {
      banner.classList.remove('show', 'yum');
      banner.innerHTML = '';
      return;
    }
    const next = '<button class="btn btn-next" onclick="resetGame()">▶ Nouvelle partie</button>';
    if (game.viaYum) {
      banner.innerHTML = `🎉🎲 ${escapeAttr(w.name)} gagne la partie avec un YUM ! 🎲🎉 ${next}`;
      banner.classList.add('yum');
    } else {
      banner.innerHTML = `🎉 ${escapeAttr(w.name)} gagne la partie ! ${next}`;
      banner.classList.remove('yum');
    }
    banner.classList.add('show');
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function resetGame() {
    // Une partie commencée mais non terminée est quand même conservée dans l'historique
    if (!game.finished && state.teams.some(t => t.history.length > 0)) {
      archiveGame('abandoned', null);
    }
    game = newGameState();
    hideYum(true);
    document.getElementById('gameName').value = defaultGameName();
    const start = getStart();
    state.teams.forEach(t => {
      t.score = start;
      t.history = [];
      t.hitMilestone = false;
    });
    render();
  }


  // ================= Historique des parties =================
  function renderGames() {
    const sec = document.getElementById('gamesSection');
    const clearBtn = games.length
      ? `<button class="btn btn-clear ${clearArmed ? 'armed' : ''}" onclick="clearGames()">${clearArmed ? 'Cliquer pour confirmer' : '🗑 Vider l’historique'}</button>`
      : '';

    let body;
    if (games.length === 0) {
      body = '<div class="stats-empty">Aucune partie enregistrée pour l’instant — elle apparaîtra ici dès qu’une équipe termine sa partie (ou fait un YUM !).</div>';
    } else {
      body = '<div class="games-list">' + games.map((g, i) => {
        const num = games.length - i;
        const badge = g.status === 'yum'
          ? '<span class="badge yum">🎉 Victoire par YUM</span>'
          : g.status === 'won'
            ? '<span class="badge won">🏆 Victoire</span>'
            : '<span class="badge abandoned">⏸ Partie interrompue</span>';
        const order = g.teams.map((t, idx) => ({ t, idx })).sort((a, b) => {
          if (a.idx === g.winnerIndex) return -1;
          if (b.idx === g.winnerIndex) return 1;
          return a.t.score - b.t.score;
        });
        const players = order.map(({ t, idx }) => {
          const isW = idx === g.winnerIndex;
          const sub = t.rounds > 0
            ? `${t.rounds} tour${t.rounds > 1 ? 's' : ''} · ${t.total.toLocaleString('fr-CA')} pts joués`
            : (isW && g.status === 'yum' ? 'YUM direct !' : 'aucun tour');
          return `
            <div class="game-player ${isW ? 'winner' : ''}">
              <div class="pname"><span class="dot" style="background:${t.color};"></span><span class="txt">${isW ? '👑 ' : ''}${escapeAttr(t.name)}</span></div>
              <div class="pscore">${t.score.toLocaleString('fr-CA')}<span class="psub">${sub}</span></div>
            </div>`;
        }).join('');
        return `
          <div class="game-card ${g.status}">
            <div class="game-card-head">
              <input class="game-title" type="text" value="${escapeAttr(g.name)}" oninput="renameGame('${g.id}', this.value)" aria-label="Nom de la partie">
              <button class="game-del" title="Supprimer cette partie" onclick="deleteGame('${g.id}')">✕</button>
            </div>
            <div class="game-meta">Partie n° ${num} · ${fmtDate(g.endedAt)} · départ ${g.startScore.toLocaleString('fr-CA')}</div>
            ${badge}
            <div class="game-players">${players}</div>
          </div>`;
      }).join('') + '</div>';
    }

    sec.innerHTML = `
      <div class="games-head">
        <h3 class="stats-title">📚 Historique des parties${games.length ? ' (' + games.length + ')' : ''}</h3>
        ${clearBtn}
      </div>
      ${body}
    `;
  }

  function renameGame(id, value) {
    const g = games.find(x => x.id === id);
    if (!g) return;
    g.name = value;
    if (game.archivedId === id) document.getElementById('gameName').value = value;
    saveGames();
  }

  function deleteGame(id) {
    if (game.archivedId === id) game.archivedId = null;
    games = games.filter(g => g.id !== id);
    saveGames();
    renderGames();
  }

  function clearGames() {
    if (!clearArmed) {
      clearArmed = true;
      renderGames();
      setTimeout(() => { if (clearArmed) { clearArmed = false; renderGames(); } }, 4000);
      return;
    }
    clearArmed = false;
    games = [];
    game.archivedId = null;
    saveGames();
    renderGames();
  }

  // ================= Célébration YUM (effet maximal) =================
  let yumTimers = [];
  let audioCtx = null;
  const FX_COLORS = ['#ff5c9c', '#ffcd3c', '#3ecf8e', '#4f8cff', '#b26bff', '#ff7a59', '#ffffff'];
  const FX_EMOJIS = ['🎲', '🎉', '🥳', '🎊', '✨', '🏆', '💥', '🔥', '🌟', '🤩', '🍾', '👏'];
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function later(fn, ms) { yumTimers.push(setTimeout(fn, ms)); }

  function newFx() {
    const el = document.createElement('div');
    el.className = 'fx-piece';
    document.body.appendChild(el);
    return el;
  }

  // Canon à confettis dans un coin du bas, trajectoire balistique
  function launchCannon(side, count) {
    const W = window.innerWidth, H = window.innerHeight;
    const dirX = side === 'left' ? 1 : -1;
    for (let i = 0; i < count; i++) {
      const el = newFx();
      const w = rand(6, 13);
      el.style.width = w + 'px';
      el.style.height = (w * rand(0.8, 1.8)) + 'px';
      el.style.background = pick(FX_COLORS);
      if (Math.random() > 0.55) el.style.borderRadius = '50%';
      el.style.left = (side === 'left' ? 0 : W) + 'px';
      el.style.top = H + 'px';
      const angle = rand(38, 82) * Math.PI / 180;
      const speed = rand(650, 1500) * Math.max(0.6, Math.min(1.3, H / 800));
      const vx = Math.cos(angle) * speed * dirX;
      const vy = -Math.sin(angle) * speed;
      const g = 1500, T = rand(2.0, 3.2), rot = rand(-900, 900);
      const frames = [];
      const N = 10;
      for (let k = 0; k <= N; k++) {
        const t = (k / N) * T;
        frames.push({
          transform: `translate(${vx * t}px, ${vy * t + 0.5 * g * t * t}px) rotate(${rot * k / N}deg)`,
          opacity: k > N - 3 ? 1 - (k - (N - 3)) / 3 : 1
        });
      }
      const anim = el.animate(frames, { duration: T * 1000, easing: 'linear', fill: 'forwards', delay: rand(0, 250) });
      anim.onfinish = () => el.remove();
    }
  }

  // Feu d'artifice : gerbe radiale de particules lumineuses
  function fireworkBurst(x, y) {
    const color = pick(FX_COLORS);
    const color2 = pick(FX_COLORS);
    const n = 38;
    for (let i = 0; i < n; i++) {
      const el = newFx();
      const c = i % 3 === 0 ? color2 : color;
      const size = rand(4, 8);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.borderRadius = '50%';
      el.style.background = c;
      el.style.boxShadow = `0 0 10px 2px ${c}`;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const a = (i / n) * Math.PI * 2 + rand(-0.08, 0.08);
      const d = rand(90, 230);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      const anim = el.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(1)`, opacity: 1, offset: 0.6 },
        { transform: `translate(${dx * 1.08}px, ${dy * 1.08 + 60}px) scale(0.2)`, opacity: 0 }
      ], { duration: rand(1100, 1700), easing: 'cubic-bezier(0.1, 0.7, 0.3, 1)', fill: 'forwards' });
      anim.onfinish = () => el.remove();
    }
  }

  function randomBurst() {
    fireworkBurst(rand(0.08, 0.92) * window.innerWidth, rand(0.12, 0.6) * window.innerHeight);
  }

  // Pluie d'émojis festifs
  function emojiRain(count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'emoji-piece';
      el.textContent = pick(FX_EMOJIS);
      el.style.left = rand(0, 98) + 'vw';
      el.style.fontSize = rand(1.4, 3.4) + 'rem';
      const dur = rand(2.4, 4.6), delay = rand(0, 0.8);
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = delay + 's';
      el.style.setProperty('--sway', rand(-120, 120) + 'px');
      el.style.setProperty('--rot', rand(-540, 540) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), (dur + delay) * 1000 + 300);
    }
  }

  // Petite fanfare synthétisée (Web Audio) — jouée seulement si "Sons" est coché
  function playFanfare() {
    try {
      if (!document.getElementById('soundOn').checked) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime + 0.02;
      const tone = (freq, start, dur, type, vol) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, now + start);
        g.gain.exponentialRampToValueAtTime(vol, now + start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + start); o.stop(now + start + dur + 0.05);
      };
      // Arpège montant C5 E5 G5 C6 puis accord final tenu
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.11, 0.22, 'square', 0.12));
      [1046.5, 1318.5, 1568.0, 2093.0].forEach(f => tone(f, 0.5, 1.4, 'triangle', 0.16));
      [523.25, 659.25, 783.99].forEach(f => tone(f, 0.5, 1.4, 'sawtooth', 0.05));
      // Petits "pop" de feux d'artifice
      [0.9, 1.25, 1.55, 1.9, 2.2].forEach((t, i) => tone(1800 + i * 260, t, 0.12, 'sine', 0.1));
    } catch (e) { /* audio indisponible : sans conséquence */ }
  }

  function hideYum(immediate) {
    yumTimers.forEach(clearTimeout);
    yumTimers = [];
    const o = document.getElementById('yumOverlay');
    document.querySelectorAll('.team.yum-glow').forEach(c => c.classList.remove('yum-glow'));
    if (immediate || !o.classList.contains('show')) {
      o.classList.remove('show', 'hide');
      return;
    }
    o.classList.add('hide');
    setTimeout(() => o.classList.remove('show', 'hide'), 700);
  }

  function celebrateYum(team) {
    hideYum(true);
    const o = document.getElementById('yumOverlay');
    document.getElementById('yumTeam').textContent = `${team.name} a fait un YUM !`;
    void o.offsetWidth;
    o.classList.add('show');

    // Carte de l'équipe qui s'illumine en arc-en-ciel
    const card = document.getElementById('team-' + team.id);
    if (card) card.classList.add('yum-glow');

    // Flash arc-en-ciel + tremblement de l'écran
    document.body.classList.remove('yum-rainbow');
    void document.body.offsetWidth;
    document.body.classList.add('yum-rainbow');
    const wrap = document.getElementById('wrap');
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');
    later(() => { document.body.classList.remove('yum-rainbow'); wrap.classList.remove('shake'); }, 3700);

    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 300]); } catch (e) {}
    playFanfare();

    // Explosion initiale
    launchCannon('left', 110);
    launchCannon('right', 110);
    launchConfetti(180);
    emojiRain(45);
    for (let i = 0; i < 4; i++) later(randomBurst, i * 180);

    // Vagues successives pendant ~6 secondes
    for (let i = 1; i <= 12; i++) {
      later(() => {
        launchCannon(i % 2 ? 'left' : 'right', 55);
        randomBurst();
        if (i % 2 === 0) { randomBurst(); launchConfetti(70); }
        if (i % 3 === 0) emojiRain(18);
      }, 450 * i);
    }

    // Retrait automatique de l'écran géant
    later(() => hideYum(), 7200);
  }

  document.getElementById('startScore').addEventListener('change', resetGame);

  document.getElementById('gameName').value = defaultGameName();
  render();
  renderGames();
</script>
</body>
</html>
