<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur — Jeu de dés 25 000</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --good: #3ecf8e;
    --bad: #ff5c5c;
    --gold: #ffcd3c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    position: relative;
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.92rem;
  }
  .settings {
    display:flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.88rem;
  }
  .settings label {
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--muted);
  }
  .settings input[type="number"] {
    width: 90px;
  }
  input[type="text"], input[type="number"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: #4f8cff;
  }

  /* Bandeau total */
  .totals-bar {
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .total-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    display:flex;
    flex-direction: column;
    align-items: center;
    min-width: 140px;
  }
  .total-chip .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .total-chip .value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .teams {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin-bottom: 18px;
  }
  .team {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.4s ease, transform 0.3s ease, background-color 0.8s ease;
  }
  .team::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--team-color);
  }
  .team-header {
    display:flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .team-name {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .team-name:hover, .team-name:focus {
    border-bottom: 1px dashed var(--border);
    outline: none;
  }
  .remove-team {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.5;
    padding: 2px 6px;
  }
  .remove-team:hover { opacity: 1; color: var(--bad); }
  .score {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 10px 0 4px;
    font-variant-numeric: tabular-nums;
    transition: color 0.25s ease, transform 0.2s ease;
    color: var(--team-color);
  }
  .score.won { color: var(--good) !important; }
  .score.pulse { animation: scorePulse 1.1s ease; }
  @keyframes scorePulse {
    0% { transform: scale(1); }
    25% { transform: scale(1.18); text-shadow: 0 0 18px var(--gold); }
    50% { transform: scale(0.97); }
    75% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .status {
    min-height: 20px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .status.won { color: var(--good); font-weight: 600; }
  .status.bust { color: var(--bad); }
  .status.milestone { color: var(--gold); font-weight: 600; }

  .mini-stats {
    display:flex;
    gap: 14px;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .mini-stats b { color: var(--text); }

  .input-row {
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-row input[type="number"] {
    flex: 1;
    font-size: 1rem;
    padding: 10px 12px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-sub {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .team .btn-sub:hover { border-color: var(--team-color); color: var(--team-color); }
  .quick-row {
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .quick-row button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
  }
  .quick-row button:hover { color: var(--text); border-color: var(--text); }
  .history {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    max-height: 150px;
    overflow-y: auto;
  }
  .history h4 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .history ul {
    list-style: none;
    margin: 0; padding: 0;
    display:flex;
    flex-direction: column;
    gap: 4px;
  }
  .history li {
    display:flex;
    justify-content: space-between;
    font-size: 0.83rem;
    color: var(--muted);
    padding: 4px 6px;
    border-radius: 6px;
    background: var(--panel-2);
  }
  .history li .neg { color: var(--bad); }
  .history li button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0 4px;
  }
  .history li button:hover { color: var(--bad); }
  .history-empty {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    padding: 6px;
  }

  .add-team-card {
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    display:flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 600;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .add-team-card:hover {
    border-color: #4f8cff;
    color: #4f8cff;
  }

  .footer-actions {
    display:flex;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
  }
  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-reset:hover { color: var(--bad); border-color: var(--bad); }
  .winner-banner {
    text-align: center;
    margin: 0 0 18px;
    padding: 12px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(62,207,142,0.15), rgba(62,207,142,0.05));
    border: 1px solid rgba(62,207,142,0.4);
    color: var(--good);
    font-weight: 700;
    font-size: 1.05rem;
    display: none;
  }
  .winner-banner.show { display: block; }

  /* Toast milestone 20000 */
  .milestone-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: linear-gradient(135deg, #ffcd3c, #ff9d3c);
    color: #241a00;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(255, 205, 60, 0.4);
    opacity: 0;
    z-index: 999;
    pointer-events: none;
    font-size: 0.95rem;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .milestone-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .team.milestone-glow {
    box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(255, 205, 60, 0.5);
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 9px;
    height: 14px;
    z-index: 998;
    pointer-events: none;
    border-radius: 2px;
    animation-name: confetti-fall;
    animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 1);
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* Victoire — score à 0 */
  .victory-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: linear-gradient(135deg, #ffcd3c, #ff7a59, #b26bff);
    background-size: 200% 200%;
    color: #1a1200;
    font-weight: 800;
    font-size: 1.6rem;
    padding: 22px 40px;
    border-radius: 20px;
    box-shadow: 0 16px 60px rgba(255, 205, 60, 0.55);
    opacity: 0;
    z-index: 1001;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .victory-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: victoryGradient 1.8s ease infinite;
  }
  @keyframes victoryGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .team.victory-glow {
    animation: victoryPulse 0.9s ease-in-out 3;
    box-shadow: 0 0 0 3px var(--gold), 0 0 45px rgba(255, 205, 60, 0.75);
  }
  @keyframes victoryPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  body.screen-flash::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,205,60,0.35), transparent 70%);
    z-index: 1000;
    pointer-events: none;
    animation: flashFade 0.7s ease forwards;
  }
  @keyframes flashFade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Statistiques */
  .stats-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-top: 22px;
  }
  .stats-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 16px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .stats-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-card .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .stats-table-wrap {
    overflow-x: auto;
  }
  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  table.stats-table th, table.stats-table td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.stats-table th {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  table.stats-table td.team-cell {
    font-weight: 700;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  table.stats-table td.team-cell .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  table.stats-table tbody tr:hover {
    background: var(--panel-2);
  }
  .progress-track {
    display:inline-block;
    width: 90px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    vertical-align: middle;
    margin-right: 6px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
  }
  .stats-empty {
    color: var(--muted);
    font-size: 0.88rem;
    font-style: italic;
    text-align: center;
    padding: 10px 0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>🎲 Calculateur — Jeu de dés 25 000</h1>
    <p>Chaque équipe part du score de départ et on soustrait les points marqués à chaque tour, jusqu'à zéro.</p>
  </header>

  <div class="settings">
    <label>Score de départ
      <input type="number" id="startScore" value="25000" step="500" min="0">
    </label>
    <label>
      <input type="checkbox" id="exactMode" checked>
      Il faut tomber pile sur 0 (sinon le tour est refusé)
    </label>
  </div>

  <div class="totals-bar" id="totalsBar"></div>

  <div class="winner-banner" id="winnerBanner"></div>

  <div class="teams" id="teamsContainer"></div>

  <div class="stats-section" id="statsSection"></div>

  <div class="footer-actions">
    <button class="btn btn-reset" onclick="resetGame()">↺ Nouvelle partie</button>
  </div>
</div>

<div class="milestone-toast" id="milestoneToast"></div>
<div class="victory-banner" id="victoryBanner"></div>

<script>
  const PALETTE = ['#4f8cff', '#ff7a59', '#ffcd3c', '#b26bff', '#3ecf8e', '#ff5c9c'];
  const MAX_TEAMS = 6;
  const MIN_TEAMS = 2;
  const MILESTONE = 20000;
  const GREEN_THRESHOLD = 20000;
  const RED_THRESHOLD = 5000;

  // Couleur de fond de la carte selon le score : neutre au-dessus de 20000,
  // vert entre 5000 et 20000, rouge sous 5000 — plus foncé en s'approchant de 0.
  function zoneBackground(score) {
    if (score > GREEN_THRESHOLD) return null;
    if (score > RED_THRESHOLD) {
      const range = GREEN_THRESHOLD - RED_THRESHOLD;
      const t = (score - RED_THRESHOLD) / range; // 0 près de 5000 (foncé) -> 1 près de 20000 (clair)
      const lightness = 11 + t * 11; // 11% -> 22%
      return `hsl(142, 55%, ${lightness}%)`;
    }
    const t = Math.max(0, score) / RED_THRESHOLD; // 0 à zéro (le plus foncé) -> 1 à 5000 (plus clair)
    const lightness = 8 + t * 12; // 8% -> 20%
    return `hsl(2, 65%, ${lightness}%)`;
  }

  let nextId = 3;
  let state = {
    teams: [
      { id: 1, name: 'Équipe 1', score: 25000, history: [], hitMilestone: false },
      { id: 2, name: 'Équipe 2', score: 25000, history: [], hitMilestone: false }
    ]
  };

  function getStart() {
    const v = parseInt(document.getElementById('startScore').value, 10);
    return isNaN(v) ? 25000 : v;
  }

  function isExactMode() {
    return document.getElementById('exactMode').checked;
  }

  function colorFor(index) {
    return PALETTE[index % PALETTE.length];
  }

  function addTeam() {
    if (state.teams.length >= MAX_TEAMS) return;
    state.teams.push({
      id: nextId++,
      name: 'Équipe ' + (state.teams.length + 1),
      score: getStart(),
      history: [],
      hitMilestone: false
    });
    render();
  }

  function removeTeam(id) {
    if (state.teams.length <= MIN_TEAMS) return;
    state.teams = state.teams.filter(t => t.id !== id);
    render();
  }

  function quickAdd(id, amount) {
    const input = document.getElementById('input-' + id);
    const current = parseInt(input.value, 10) || 0;
    input.value = current + amount;
    input.focus();
  }

  function clearInput(id) {
    const input = document.getElementById('input-' + id);
    input.value = '';
    input.focus();
  }

  function findTeam(id) {
    return state.teams.find(t => t.id === id);
  }

  function subtractScore(id) {
    const input = document.getElementById('input-' + id);
    const pts = parseInt(input.value, 10);
    const statusEl = document.getElementById('status-' + id);
    const t = findTeam(id);
    if (!t) return;

    if (isNaN(pts) || pts <= 0) {
      statusEl.textContent = "Entrez un nombre de points valide.";
      statusEl.className = 'status bust';
      return;
    }

    const newScore = t.score - pts;

    if (newScore < 0) {
      statusEl.textContent = `Trop de points — le score irait à ${newScore.toLocaleString('fr-CA')} (refusé).`;
      statusEl.className = 'status bust';
      return;
    }

    if (isExactMode() && newScore !== 0 && pts > t.score) {
      statusEl.textContent = "Score refusé (mode exact requis).";
      statusEl.className = 'status bust';
      return;
    }

    const crossedMilestone = t.score > MILESTONE && newScore <= MILESTONE && !t.hitMilestone;
    const reachedZero = newScore === 0 && t.score !== 0;

    t.score = newScore;
    t.history.push({ pts, resultingScore: newScore });
    input.value = '';
    statusEl.textContent = '';
    statusEl.className = 'status';

    render();

    if (reachedZero) {
      t.hitMilestone = true;
      celebrateWin(t);
    } else if (crossedMilestone) {
      t.hitMilestone = true;
      celebrateMilestone(t);
    }
  }

  function undoLast(id) {
    const t = findTeam(id);
    if (!t || t.history.length === 0) return;
    t.score += t.history.pop().pts;
    if (t.score > MILESTONE) t.hitMilestone = false;
    render();
  }

  function celebrateMilestone(team) {
    const toast = document.getElementById('milestoneToast');
    toast.textContent = `⚡ ${team.name} passe sous les 20 000 !`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);

    const card = document.getElementById('team-' + team.id);
    if (card) {
      card.classList.add('milestone-glow');
      setTimeout(() => card.classList.remove('milestone-glow'), 2200);
    }
    const scoreEl = document.getElementById('score-' + team.id);
    if (scoreEl) {
      scoreEl.classList.remove('pulse');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pulse');
    }

    launchConfetti(60);
  }

  function celebrateWin(team) {
    const banner = document.getElementById('victoryBanner');
    banner.textContent = `🏆 ${team.name} termine la partie ! 🏆`;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 3600);

    const card = document.getElementById('team-' + team.id);
    if (card) {
      card.classList.add('victory-glow');
      setTimeout(() => card.classList.remove('victory-glow'), 3200);
    }
    const scoreEl = document.getElementById('score-' + team.id);
    if (scoreEl) {
      scoreEl.classList.remove('pulse');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pulse');
    }

    // Grosse pluie de confettis en plusieurs vagues, façon feu d'artifice
    launchConfetti(140);
    setTimeout(() => launchConfetti(90), 350);
    setTimeout(() => launchConfetti(90), 750);

    document.body.classList.add('screen-flash');
    setTimeout(() => document.body.classList.remove('screen-flash'), 700);
  }

  function launchConfetti(count) {
    const colors = ['#ffcd3c', '#ff7a59', '#4f8cff', '#3ecf8e', '#ff5c9c', '#b26bff'];
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      const size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = (size * 1.5) + 'px';
      if (Math.random() > 0.5) piece.style.borderRadius = '50%';
      const duration = 1.8 + Math.random() * 1.6;
      const delay = Math.random() * 0.4;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.opacity = '0';
      document.body.appendChild(piece);
      setTimeout(() => { piece.style.opacity = '1'; }, delay * 1000);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 200);
    }
  }

  function render() {
    renderTeams();
    renderTotals();
    renderStats();
    checkWinner();
  }

  function renderStats() {
    const section = document.getElementById('statsSection');
    const start = getStart();
    const anyRounds = state.teams.some(t => t.history.length > 0);

    // Stats par équipe
    const teamStats = state.teams.map((t, index) => {
      const pts = t.history.map(h => h.pts);
      const rounds = pts.length;
      const total = pts.reduce((s, p) => s + p, 0);
      const average = rounds > 0 ? total / rounds : 0;
      const best = rounds > 0 ? Math.max(...pts) : 0;
      const worst = rounds > 0 ? Math.min(...pts) : 0;
      const progress = start > 0 ? Math.min(100, Math.max(0, ((start - t.score) / start) * 100)) : 0;
      return { team: t, color: colorFor(index), rounds, total, average, best, worst, progress };
    });

    // Stats globales
    const totalRoundsAll = teamStats.reduce((s, x) => s + x.rounds, 0);
    const totalPointsAll = teamStats.reduce((s, x) => s + x.total, 0);
    const globalAverage = totalRoundsAll > 0 ? totalPointsAll / totalRoundsAll : 0;

    let bestRoundOverall = null;
    teamStats.forEach(x => {
      x.team.history.forEach(h => {
        if (!bestRoundOverall || h.pts > bestRoundOverall.pts) {
          bestRoundOverall = { pts: h.pts, teamName: x.team.name, color: x.color };
        }
      });
    });

    let leader = null;
    if (anyRounds || state.teams.length > 0) {
      leader = state.teams.reduce((min, t) => (min === null || t.score < min.score) ? t : min, null);
    }
    const leaderIndex = leader ? state.teams.indexOf(leader) : -1;

    const summaryHtml = `
      <div class="stat-card">
        <div class="label">Équipe en tête</div>
        <div class="value" style="color:${leader ? colorFor(leaderIndex) : 'inherit'};">${leader ? escapeAttr(leader.name) : '—'}</div>
        <div class="sub">${leader ? leader.score.toLocaleString('fr-CA') + ' pts restants' : ''}</div>
      </div>
      <div class="stat-card">
        <div class="label">Tours joués (total)</div>
        <div class="value">${totalRoundsAll}</div>
      </div>
      <div class="stat-card">
        <div class="label">Points joués (total)</div>
        <div class="value">${totalPointsAll.toLocaleString('fr-CA')}</div>
      </div>
      <div class="stat-card">
        <div class="label">Moyenne globale / tour</div>
        <div class="value">${globalAverage.toLocaleString('fr-CA', {maximumFractionDigits: 0})}</div>
      </div>
      <div class="stat-card">
        <div class="label">Meilleur tour (record)</div>
        <div class="value" style="color:${bestRoundOverall ? bestRoundOverall.color : 'inherit'};">${bestRoundOverall ? bestRoundOverall.pts.toLocaleString('fr-CA') : '—'}</div>
        <div class="sub">${bestRoundOverall ? escapeAttr(bestRoundOverall.teamName) : ''}</div>
      </div>
    `;

    let tableHtml;
    if (!anyRounds) {
      tableHtml = '<div class="stats-empty">Jouez un premier tour pour voir apparaître les statistiques détaillées.</div>';
    } else {
      const rows = teamStats.map(x => {
        const barColor = x.progress >= 80 ? 'var(--good)' : (x.progress >= 40 ? x.color : 'var(--bad)');
        return `
          <tr>
            <td class="team-cell"><span class="dot" style="background:${x.color};"></span>${escapeAttr(x.team.name)}</td>
            <td>${x.team.score.toLocaleString('fr-CA')}</td>
            <td>${x.rounds}</td>
            <td>${x.total.toLocaleString('fr-CA')}</td>
            <td>${x.average.toLocaleString('fr-CA', {maximumFractionDigits: 0})}</td>
            <td>${x.rounds > 0 ? x.best.toLocaleString('fr-CA') : '—'}</td>
            <td>${x.rounds > 0 ? x.worst.toLocaleString('fr-CA') : '—'}</td>
            <td>
              <span class="progress-track"><span class="progress-fill" style="width:${x.progress}%; background:${barColor};"></span></span>
              ${x.progress.toFixed(0)}%
            </td>
          </tr>
        `;
      }).join('');

      tableHtml = `
        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>Équipe</th>
                <th>Score actuel</th>
                <th>Tours</th>
                <th>Total joué</th>
                <th>Moyenne / tour</th>
                <th>Meilleur tour</th>
                <th>Pire tour</th>
                <th>Progression</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    section.innerHTML = `
      <h3 class="stats-title">📊 Statistiques</h3>
      <div class="stats-summary">${summaryHtml}</div>
      ${tableHtml}
    `;
  }

  function renderTeams() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';

    state.teams.forEach((t, index) => {
      const color = colorFor(index);
      const card = document.createElement('div');
      card.className = 'team';
      card.id = 'team-' + t.id;
      card.style.setProperty('--team-color', color);
      const bg = zoneBackground(t.score);
      card.style.backgroundColor = bg || 'var(--panel)';

      const removeBtn = state.teams.length > MIN_TEAMS
        ? `<button class="remove-team" title="Retirer cette équipe" onclick="removeTeam(${t.id})">✕</button>`
        : '';

      const roundsPlayed = t.history.length;
      const totalPlayed = t.history.reduce((sum, h) => sum + h.pts, 0);

      let historyHtml;
      if (t.history.length === 0) {
        historyHtml = '<div class="history-empty">Aucun tour joué</div>';
      } else {
        const items = t.history.slice().reverse().map((h, idxRev) => {
          const idx = t.history.length - 1 - idxRev;
          const isLast = idx === t.history.length - 1;
          const undoHtml = isLast ? `<button onclick="undoLast(${t.id})">↺ annuler</button>` : '';
          return `<li><span>Tour ${idx + 1} : <span class="neg">-${h.pts.toLocaleString('fr-CA')}</span> → ${h.resultingScore.toLocaleString('fr-CA')}</span>${undoHtml}</li>`;
        }).join('');
        historyHtml = `<ul>${items}</ul>`;
      }

      card.innerHTML = `
        <div class="team-header">
          <input class="team-name" id="name-${t.id}" type="text" value="${escapeAttr(t.name)}" oninput="renameTeam(${t.id}, this.value)">
          ${removeBtn}
        </div>
        <div class="score" id="score-${t.id}">${t.score.toLocaleString('fr-CA')}</div>
        <div class="status" id="status-${t.id}"></div>
        <div class="mini-stats">
          <span>Tours : <b>${roundsPlayed}</b></span>
          <span>Total joué : <b>${totalPlayed.toLocaleString('fr-CA')}</b></span>
        </div>
        <div class="input-row">
          <input type="number" id="input-${t.id}" placeholder="Points du tour" inputmode="numeric">
          <button class="btn btn-sub" onclick="subtractScore(${t.id})">Soustraire</button>
        </div>
        <div class="quick-row">
          <button onclick="quickAdd(${t.id},50)">+50</button>
          <button onclick="quickAdd(${t.id},100)">+100</button>
          <button onclick="quickAdd(${t.id},250)">+250</button>
          <button onclick="quickAdd(${t.id},500)">+500</button>
          <button onclick="quickAdd(${t.id},1000)">+1000</button>
          <button onclick="clearInput(${t.id})" style="margin-left:auto;">effacer</button>
        </div>
        <div class="history">
          <h4>Historique</h4>
          ${historyHtml}
        </div>
      `;

      if (t.score === 0) {
        const scoreEl = card.querySelector('.score');
        scoreEl.classList.add('won');
        card.querySelector('.status').textContent = '🏆 Score atteint !';
        card.querySelector('.status').className = 'status won';
      }

      container.appendChild(card);

      const input = document.getElementById('input-' + t.id);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') subtractScore(t.id);
      });
    });

    if (state.teams.length < MAX_TEAMS) {
      const addCard = document.createElement('div');
      addCard.className = 'add-team-card';
      addCard.textContent = '+ Ajouter une équipe';
      addCard.onclick = addTeam;
      container.appendChild(addCard);
    }
  }

  function renameTeam(id, value) {
    const t = findTeam(id);
    if (t) {
      t.name = value;
      renderTotals();
    }
  }

  function renderTotals() {
    const bar = document.getElementById('totalsBar');

    bar.innerHTML = state.teams.map((t, index) => {
      const color = colorFor(index);
      const totalPlayed = t.history.reduce((sum, h) => sum + h.pts, 0);
      return `
        <div class="total-chip" style="border-color:${color}66;">
          <div class="label" style="color:${color};">${escapeAttr(t.name)}</div>
          <div class="value">${totalPlayed.toLocaleString('fr-CA')} pts joués</div>
        </div>
      `;
    }).join('');
  }

  function checkWinner() {
    const banner = document.getElementById('winnerBanner');
    const winners = state.teams.filter(t => t.score === 0);

    if (winners.length === 0) {
      banner.classList.remove('show');
      return;
    }
    if (winners.length === 1) {
      banner.textContent = `🎉 ${winners[0].name} gagne la partie !`;
    } else {
      banner.textContent = `🎉 Égalité entre ${winners.map(w => w.name).join(', ')} !`;
    }
    banner.classList.add('show');
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function resetGame() {
    const start = getStart();
    state.teams.forEach(t => {
      t.score = start;
      t.history = [];
      t.hitMilestone = false;
    });
    render();
  }

  document.getElementById('startScore').addEventListener('change', resetGame);

  render();
</script>
</body>
</html>
